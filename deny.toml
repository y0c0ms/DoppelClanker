# Policy for the Rust crates in this repo. Enforced by .github/workflows/audit.yml.

[advisories]
# Unmaintained or unsound crates fail the build, not just known vulnerabilities.
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
# Permissive licenses only. A new dependency under any other license fails the build,
# so it is a deliberate decision rather than a silent addition.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "LGPL-2.1-or-later",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are a warning, not a failure: the ecosystem often needs two majors.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io. No git dependencies or alternate registries.
unknown-registry = "deny"
unknown-git = "deny"
