# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
PackageIdentifier: DoppelClanker.HarnessSync
PackageVersion: <VERSION>
InstallerLocale: en-US
MinimumOSVersion: 10.0.17763.0
Platform:
  - Windows.Desktop
InstallModes:
  - silent
  - silentWithProgress
Installers:
  - Architecture: x64
    InstallerType: zip
    InstallerUrl: <URL>
    InstallerSha256: <SHA256>
    Scope: user
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: bin\sesync.exe
        PortableCommandAlias: sesync
      - RelativeFilePath: bin\sesync-conv.exe
        PortableCommandAlias: sesync-conv
      - RelativeFilePath: bin\sesync-lock.exe
        PortableCommandAlias: sesync-lock
ManifestType: installer
ManifestVersion: 1.10.0
