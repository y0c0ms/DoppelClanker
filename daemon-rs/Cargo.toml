[package]
name = "harness-sync"
version = "0.1.0"
edition = "2021"
description = "harness-sync daemon (Rust port of daemon/harness_sync.py)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v5"] }
ratatui = "0.30"
rusqlite = { version = "0.32", features = ["bundled"] }
crossterm = "0.29"
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
proptest = "1"
