name: release

# Runs on a version tag such as v0.1.0. Builds the three binaries for each OS, packages
# them, and publishes the archives with a SHA256SUMS file. Nothing is signed here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build the three binaries
        shell: bash
        run: |
          cargo build --release --manifest-path sesync-lock/Cargo.toml
          cargo build --release --manifest-path sesync-conv/Cargo.toml
          cargo build --release --manifest-path sesync/Cargo.toml
      - name: package (Windows zip for winget, tar.gz elsewhere)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="sesync-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE/bin" "$STAGE/share/sesync/hooks"
          EXT=""; [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          cp "sesync-lock/target/release/sesync-lock${EXT}" "$STAGE/bin/"
          cp "sesync-conv/target/release/sesync-conv${EXT}" "$STAGE/bin/"
          cp "sesync/target/release/sesync${EXT}" "$STAGE/bin/"
          cp hooks/* "$STAGE/share/sesync/hooks/"
          cp README.md LICENSE "$STAGE/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            # winget resolves RelativeFilePath from the root of the zip, so bin\ must sit
            # at the top level of the archive, not inside the versioned folder.
            (cd "$STAGE" && 7z a "../$STAGE.zip" . >/dev/null)
            echo "ARCHIVE=$STAGE.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$STAGE.tar.gz" "$STAGE"
            echo "ARCHIVE=$STAGE.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum sesync-* > SHA256SUMS && cat SHA256SUMS
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "Archives for Linux, macOS and Windows with SHA256SUMS. Windows zip matches packaging/winget."
