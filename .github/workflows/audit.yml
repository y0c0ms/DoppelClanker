name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories land after code is merged, so re-scan weekly even with no changes.
    - cron: "0 6 * * 1"

jobs:
  cargo-audit:
    name: cargo audit (all Cargo.lock files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit and cargo-deny
        run: cargo install cargo-audit cargo-deny --locked
      - name: scan every lock file, fail on any advisory
        run: |
          set -e
          for lock in $(find . -name Cargo.lock -not -path "*/target/*"); do
            dir=$(dirname "$lock")
            echo "== $dir"
            (cd "$dir" && cargo audit --deny warnings)
          done
      - name: cargo-deny policy (advisories, licenses, bans, sources)
        run: |
          set -e
          for lock in $(find . -name Cargo.lock -not -path "*/target/*"); do
            dir=$(dirname "$lock")
            (cd "$dir" && cargo deny --config "$GITHUB_WORKSPACE/deny.toml" check)
          done
