name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unix:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build-test.sh
        # Hosted runners have no logged-in harness CLIs, so the gated tests find none
        # and skip; setting HS_E2E keeps the gate explicit if a runner ever has them.
        env:
          HS_E2E: "1"
        run: sh build-test.sh
      - name: installer lifecycle (install, run, uninstall)
        run: sh tests/install_package.sh
      - name: macOS launch agent generated by the installer is valid
        if: runner.os == 'macOS'
        run: |
          cargo build --release --manifest-path lock/Cargo.toml
          cargo build --release --manifest-path hsconv/Cargo.toml
          cargo build --release --manifest-path daemon-rs/Cargo.toml
          SANDBOX=$(mktemp -d)
          HOME="$SANDBOX/home" sh install.sh --prefix "$SANDBOX/prefix" --no-build
          plutil -lint "$SANDBOX/home/Library/LaunchAgents/com.harnesssync.watch.plist"

  team-server-postgres:
    name: team server against a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: run the Postgres tests, which must not skip
        working-directory: team-server
        env:
          TEAM_TEST_PG: postgres://postgres:ci-only-throwaway@127.0.0.1:5432/postgres
          TEAM_REQUIRE_PG: "1"
        run: cargo test --test postgres_store --test startup_retry

  windows:
    name: build and smoke test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build the three binaries
        shell: pwsh
        run: |
          cargo build --release --manifest-path lock/Cargo.toml
          cargo build --release --manifest-path hsconv/Cargo.toml
          cargo build --release --manifest-path daemon-rs/Cargo.toml
      - name: run the lock and converter test suites
        shell: pwsh
        run: |
          cargo test --manifest-path lock/Cargo.toml
          cargo test --manifest-path hsconv/Cargo.toml
      - name: smoke test the daemon in an isolated profile
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "hs-profile"
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $env:HARNESS_SYNC_DIR = Join-Path $profile "state"
          $env:OMP_AGENT_DIR = Join-Path $profile "omp"
          $env:PI_AGENT_DIR = Join-Path $profile "pi"
          $env:CLAUDE_CONFIG_DIR = Join-Path $profile "claude"
          $env:OPENCODE_DB = Join-Path $profile "none.db"
          $env:HSLOCK = Join-Path $profile "no-hslock"
          $env:HSCONV = Join-Path $PWD "hsconv\target\release\hsconv.exe"
          & "daemon-rs\target\release\harness-sync.exe" --status
          if ($LASTEXITCODE -ne 0) { throw "--status failed" }
          & "daemon-rs\target\release\harness-sync.exe" --once
          if ($LASTEXITCODE -ne 0) { throw "--once failed" }
      - name: per-user installer lifecycle (no admin)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tests\install_package.ps1
      - name: launcher is present and points at the Rust binary
        shell: pwsh
        run: |
          # The hosted runner does not register the ScriptControl COM object, so a
          # parse through COM fails for reasons unrelated to the launcher. Check the
          # launcher's contract directly instead: it exists, it starts harness-sync
          # with --watch, and it has the single-instance guard. It is never executed.
          $code = Get-Content -Raw daemon-rs\harness-sync.vbs
          if ($code -notmatch 'harness-sync\.exe') { throw "launcher does not name harness-sync.exe" }
          if ($code -notmatch '--watch') { throw "launcher does not start --watch" }
          if ($code -notmatch 'winmgmts') { throw "launcher lost its single-instance check" }
          Write-Host "launcher contract holds"
