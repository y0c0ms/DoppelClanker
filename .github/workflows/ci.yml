name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unix:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build-test.sh
        run: sh build-test.sh
      - name: installer lifecycle (install, run, uninstall)
        run: sh tests/install_package.sh
      - name: macOS launch agent generated by the installer is valid
        if: runner.os == 'macOS'
        run: |
          # Run the real installer with a sandbox HOME so the service file is written
          # under it, then lint the file the installer produced.
          SANDBOX=$(mktemp -d)
          HOME="$SANDBOX/home" sh install.sh --prefix "$SANDBOX/prefix" 2>&1 | tail -3 || true
          plutil -lint "$SANDBOX/home/Library/LaunchAgents/com.harnesssync.watch.plist"
