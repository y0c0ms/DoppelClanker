[package]
name = "hsconv"
version = "0.1.0"
edition = "2021"
description = "harness-sync converter: omp/Pi journal is the canonical form; project to OpenCode and Claude Code."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v5"] }
hex = "0.4"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
